name: Build OutlineRGB

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: Build Android ARM64 LeviPack

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Check repository
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "OutlineRGB repository"
          echo "========================================"

          test -f xmake.lua
          test -f assets/manifest.json
          test -f scripts/package_levipack.py

          test -f src/main.cpp
          test -f src/hook.cpp
          test -f src/resolver.cpp
          test -f src/renderer.cpp
          test -f src/runtime.cpp

          test -f include/outline/types.hpp
          test -f include/outline/config.hpp
          test -f include/outline/hook.hpp
          test -f include/outline/resolver.hpp
          test -f include/outline/renderer.hpp
          test -f include/outline/runtime.hpp

          echo "Repository structure OK"

      - name: Check Python package script
        shell: bash
        run: |
          set -e

          python3 -m py_compile \
            scripts/package_levipack.py

          echo "Python syntax OK"

      - name: Validate manifest
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("assets/manifest.json")

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          assert data["type"] == "preload-native"
          assert data["entry"] == "libOutlineRGB.so"

          assert "1.26.4*" in data.get(
              "minecraft_versions",
              []
          )

          print(
              json.dumps(
                  data,
                  indent=2,
                  ensure_ascii=False
              )
          )

          print()
          print("Manifest OK")
          PY

      - name: Configure Android ARM64
        shell: bash
        run: |
          set -e

          xmake f \
            -y \
            -p android \
            -a arm64-v8a \
            -m release

      - name: Build
        shell: bash
        run: |
          set -e

          xmake -y

      - name: Locate native library
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Searching build output"
          echo "========================================"

          find build \
            -type f \
            -name "*.so" \
            -print

          LIBRARY="$(
            find build \
              -type f \
              -name "liboutlinergb.so" \
              -print \
              -quit
          )"

          if [ -z "$LIBRARY" ]; then
            echo
            echo "ERROR:"
            echo "liboutlinergb.so was not found."
            echo
            exit 1
          fi

          echo
          echo "Found:"
          echo "$LIBRARY"

          mkdir -p dist

          cp \
            "$LIBRARY" \
            dist/libOutlineRGB.so

          echo
          echo "Final native library:"
          ls -lh \
            dist/libOutlineRGB.so

      - name: Verify ELF
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ELF verification"
          echo "========================================"

          file \
            dist/libOutlineRGB.so

          readelf -h \
            dist/libOutlineRGB.so \
            | tee /tmp/readelf.txt

          grep -q "AArch64" \
            /tmp/readelf.txt

          echo
          echo "AArch64 ELF OK"

      - name: Package LeviPack
        shell: bash
        run: |
          set -e

          python3 \
            scripts/package_levipack.py \
            --library \
            dist/libOutlineRGB.so \
            --manifest \
            assets/manifest.json \
            --output \
            dist/OutlineRGB.levipack

      - name: Verify LeviPack
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "LeviPack verification"
          echo "========================================"

          test -f \
            dist/OutlineRGB.levipack

          unzip -l \
            dist/OutlineRGB.levipack

          echo
          echo "Manifest:"
          unzip -p \
            dist/OutlineRGB.levipack \
            manifest.json

          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          package = Path(
              "dist/OutlineRGB.levipack"
          )

          expected = [
              "libOutlineRGB.so",
              "manifest.json"
          ]

          with zipfile.ZipFile(
              package,
              "r"
          ) as archive:

              names = archive.namelist()

              print()
              print("Actual entries:")

              for name in names:
                  print(
                      f"  {name}"
                  )

              assert names == expected, (
                  "Unexpected LeviPack structure: "
                  f"{names}"
              )

              manifest = json.loads(
                  archive.read(
                      "manifest.json"
                  )
              )

              assert (
                  manifest["type"]
                  == "preload-native"
              )

              assert (
                  manifest["entry"]
                  == "libOutlineRGB.so"
              )

              assert (
                  "1.26.4*"
                  in manifest[
                      "minecraft_versions"
                  ]
              )

              info = archive.getinfo(
                  "libOutlineRGB.so"
              )

              assert info.file_size > 0

          print()
          print(
              "LeviPack verification OK"
          )
          PY

      - name: Upload LeviPack
        uses: actions/upload-artifact@v4
        with:
          name: OutlineRGB-levipack-arm64
          path: dist/OutlineRGB.levipack
          if-no-files-found: error

name: Build OutlineRGB

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"

  pull_request:

  workflow_dispatch:


jobs:
  build:
    name: Build Android ARM64 LeviPack

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # ENVIRONMENT
      # =========================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest


      # =========================================================
      # SHOW REPOSITORY STRUCTURE
      # =========================================================

      - name: Show repository structure
        run: |
          echo "========================================"
          echo "Repository"
          echo "========================================"

          pwd

          echo ""
          echo "=== Top level ==="
          find . -maxdepth 2 -type f | sort

          echo ""
          echo "=== scripts ==="
          if [ -d scripts ]; then
            find scripts -maxdepth 2 -type f -print | sort
          else
            echo "scripts/ directory does not exist"
          fi

          echo ""
          echo "=== assets ==="
          if [ -d assets ]; then
            find assets -maxdepth 3 -type f -print | sort
          else
            echo "assets/ directory does not exist"
          fi


      # =========================================================
      # CHECK PACKAGING SCRIPT
      # =========================================================

      - name: Check LeviPack packaging script
        run: |
          set -e

          echo "========================================"
          echo "Checking package_levipack.py"
          echo "========================================"

          if [ ! -f scripts/package_levipack.py ]; then
            echo "ERROR:"
            echo "scripts/package_levipack.py was not found."
            echo ""
            echo "Current scripts directory:"
            find . -maxdepth 3 -type f -path "*/scripts/*" -print || true
            exit 1
          fi

          echo "Found:"
          ls -lh scripts/package_levipack.py

          echo ""
          echo "Python syntax check:"
          python3 -m py_compile scripts/package_levipack.py

          echo "Python syntax: OK"


      # =========================================================
      # CHECK MANIFEST
      # =========================================================

      - name: Check LeviPack manifest
        run: |
          set -e

          echo "========================================"
          echo "Checking manifest"
          echo "========================================"

          if [ -f assets/manifest.json ]; then
            echo "Found assets/manifest.json"
            cat assets/manifest.json
          elif [ -f manifest.json ]; then
            echo "Found manifest.json"
            cat manifest.json
          else
            echo "WARNING:"
            echo "No manifest.json was found."
            echo ""
            echo "The packaging script must provide the manifest"
            echo "if the LeviPack format requires one."
          fi


      # =========================================================
      # CONFIGURE XMAKE
      # =========================================================

      - name: Configure Android ARM64
        run: |
          set -e

          echo "========================================"
          echo "Configure Android ARM64"
          echo "========================================"

          xmake f \
            -p android \
            -a arm64-v8a \
            -m release


      # =========================================================
      # BUILD
      # =========================================================

      - name: Build
        run: |
          set -e

          echo "========================================"
          echo "Build"
          echo "========================================"

          xmake -y


      # =========================================================
      # SHOW BUILD OUTPUT
      # =========================================================

      - name: Show build output
        run: |
          echo "========================================"
          echo "Shared libraries"
          echo "========================================"

          if [ -d build ]; then
            find build \
              -type f \
              -name "*.so" \
              -print \
              | sort
          else
            echo "ERROR: build/ directory does not exist."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "Build tree"
          echo "========================================"

          find build \
            -maxdepth 6 \
            -type f \
            -print \
            | sort


      # =========================================================
      # CHECK NATIVE LIBRARY
      # =========================================================

      - name: Check ARM64 native library
        run: |
          set -e

          echo "========================================"
          echo "Checking native library"
          echo "========================================"

          SO_COUNT=$(find build -type f -name "*.so" | wc -l)

          echo "Found $SO_COUNT shared library/libraries."

          if [ "$SO_COUNT" -eq 0 ]; then
            echo "ERROR: No .so file was produced."
            exit 1
          fi

          echo ""
          echo "Libraries:"

          find build \
            -type f \
            -name "*.so" \
            -print \
            | sort

          echo ""
          echo "File information:"

          while IFS= read -r so; do
            echo ""
            echo "--- $so ---"
            file "$so"
            ls -lh "$so"
          done < <(find build -type f -name "*.so" | sort)


      # =========================================================
      # PACKAGE
      # =========================================================

      - name: Package LeviPack
        run: |
          set -e

          echo "========================================"
          echo "Package LeviPack"
          echo "========================================"

          mkdir -p dist

          python3 scripts/package_levipack.py


      # =========================================================
      # SHOW PACKAGE OUTPUT
      # =========================================================

      - name: Show package output
        run: |
          echo "========================================"
          echo "Package output"
          echo "========================================"

          if [ ! -d dist ]; then
            echo "ERROR: dist/ directory does not exist."
            exit 1
          fi

          find dist \
            -maxdepth 3 \
            -type f \
            -print \
            | sort

          echo ""
          echo "Directory listing:"
          ls -lah dist/


      # =========================================================
      # VERIFY LEVIPACK EXISTS
      # =========================================================

      - name: Verify LeviPack exists
        run: |
          set -e

          echo "========================================"
          echo "Verify LeviPack"
          echo "========================================"

          PACK="dist/OutlineRGB.levipack"

          if [ ! -f "$PACK" ]; then
            echo "ERROR: LeviPack was not created."
            echo ""
            echo "Expected:"
            echo "  $PACK"
            echo ""
            echo "Actual dist contents:"
            find dist \
              -maxdepth 3 \
              -type f \
              -print \
              | sort || true

            exit 1
          fi

          if [ ! -s "$PACK" ]; then
            echo "ERROR: LeviPack exists but is empty."
            exit 1
          fi

          echo "LeviPack found:"
          ls -lh "$PACK"


      # =========================================================
      # VERIFY ZIP / LEVIPACK STRUCTURE
      # =========================================================

      - name: Verify LeviPack archive
        run: |
          set -e

          PACK="dist/OutlineRGB.levipack"

          echo "========================================"
          echo "LeviPack archive"
          echo "========================================"

          echo ""
          echo "=== Archive contents ==="

          unzip -l "$PACK"

          echo ""
          echo "=== ZIP integrity ==="

          unzip -t "$PACK"

          echo ""
          echo "Archive integrity: OK"


      # =========================================================
      # VERIFY NATIVE LIBRARY INSIDE PACKAGE
      # =========================================================

      - name: Verify native library in LeviPack
        run: |
          set -e

          PACK="dist/OutlineRGB.levipack"

          echo "========================================"
          echo "Native library verification"
          echo "========================================"

          echo ""
          echo "Searching for .so files inside package..."

          SO_ENTRIES=$(unzip -Z1 "$PACK" | grep -E '\.so$' || true)

          if [ -z "$SO_ENTRIES" ]; then
            echo "ERROR: No .so file exists inside LeviPack."
            exit 1
          fi

          echo "$SO_ENTRIES"

          echo ""
          echo "Native library: FOUND"


      # =========================================================
      # VERIFY ARM64 PATH
      # =========================================================

      - name: Verify ARM64 package path
        run: |
          set -e

          PACK="dist/OutlineRGB.levipack"

          echo "========================================"
          echo "ARM64 package path"
          echo "========================================"

          ARM64_ENTRIES=$(
            unzip -Z1 "$PACK" \
              | grep -E 'arm64-v8a/.+\.so$' \
              || true
          )

          if [ -z "$ARM64_ENTRIES" ]; then
            echo "WARNING:"
            echo "No .so file was found under lib/arm64-v8a/."
            echo ""
            echo "Current archive:"
            unzip -Z1 "$PACK"
            echo ""
            echo "This may be correct only if the actual"
            echo "LeviPack format uses a different layout."
          else
            echo "ARM64 native library:"
            echo "$ARM64_ENTRIES"
          fi


      # =========================================================
      # VERIFY MANIFEST
      # =========================================================

      - name: Verify manifest
        run: |
          set -e

          PACK="dist/OutlineRGB.levipack"

          echo "========================================"
          echo "Manifest"
          echo "========================================"

          if unzip -Z1 "$PACK" | grep -qx "manifest.json"; then

            echo "manifest.json found."
            echo ""
            echo "=== manifest.json ==="

            unzip -p "$PACK" manifest.json

            echo ""
            echo ""
            echo "Validating JSON..."

            unzip -p "$PACK" manifest.json \
              | python3 -m json.tool \
              > /dev/null

            echo "Manifest JSON: OK"

          else

            echo "WARNING:"
            echo "manifest.json is not present in the root of the LeviPack."

            echo ""
            echo "Current package contents:"
            unzip -Z1 "$PACK"

          fi


      # =========================================================
      # FINAL PACKAGE INFORMATION
      # =========================================================

      - name: Final package information
        run: |
          set -e

          PACK="dist/OutlineRGB.levipack"

          echo "========================================"
          echo "FINAL PACKAGE"
          echo "========================================"

          echo ""
          echo "File:"
          ls -lh "$PACK"

          echo ""
          echo "SHA256:"
          sha256sum "$PACK"

          echo ""
          echo "Contents:"
          unzip -Z1 "$PACK"


      # =========================================================
      # UPLOAD ARTIFACT
      # =========================================================

      - name: Upload LeviPack
        uses: actions/upload-artifact@v4
        with:
          name: OutlineRGB-levipack-arm64
          path: dist/OutlineRGB.levipack
          if-no-files-found: error

name: Build OutlineRGB

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"

  pull_request:

jobs:
  build:
    name: Build Android ARM64 LeviPack

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure Android ARM64
        run: |
          xmake f \
            -p android \
            -a arm64-v8a \
            -m release

      - name: Build
        run: |
          xmake -y

      - name: Show build output
        run: |
          echo "=== Shared libraries ==="
          find build \
            -type f \
            -name "*.so" \
            -print

      - name: Package LeviPack
        run: |
          python3 scripts/package_levipack.py

      - name: Verify LeviPack
        run: |
          echo "=== LeviPack ==="
          unzip -l dist/OutlineRGB.levipack

          echo ""
          echo "=== Manifest ==="
          unzip -p dist/OutlineRGB.levipack manifest.json

      - name: Upload LeviPack
        uses: actions/upload-artifact@v4
        with:
          name: OutlineRGB-levipack-arm64
          path: dist/OutlineRGB.levipack
          if-no-files-found: error

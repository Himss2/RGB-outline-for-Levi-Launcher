name: Build OutlineRGB

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: Build Android ARM64 LeviPack

    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # DEBUG REPOSITORY
      # ============================================================

      - name: Show repository structure
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Repository structure"
          echo "========================================"

          pwd

          echo ""
          echo "Top-level files:"
          find . -maxdepth 2 -type f | sort

          echo ""
          echo "Manifest candidates:"
          find . \
            -type f \
            \( -name "manifest.json" -o -name "*.json" \) \
            -print \
            | sort

      # ============================================================
      # SETUP JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # SETUP ANDROID
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # XMAKE
      # ============================================================

      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      # ============================================================
      # FIND MANIFEST
      # ============================================================

      - name: Locate manifest
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Locating manifest.json"
          echo "========================================"

          MANIFEST="$(find . -type f -name 'manifest.json' -print -quit)"

          if [ -z "$MANIFEST" ]; then
            echo "ERROR: manifest.json was not found."
            echo ""
            echo "Available JSON files:"
            find . -type f -name "*.json" -print | sort
            exit 1
          fi

          echo "Manifest found:"
          echo "$MANIFEST"

          echo "MANIFEST_PATH=$MANIFEST" >> "$GITHUB_ENV"

      # ============================================================
      # CONFIGURE
      # ============================================================

      - name: Configure Android ARM64
        shell: bash
        run: |
          set -e

          xmake f \
            -p android \
            -a arm64-v8a \
            -m release

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build
        shell: bash
        run: |
          set -e

          xmake -y

      # ============================================================
      # FIND SO
      # ============================================================

      - name: Locate shared library
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Searching for ARM64 shared library"
          echo "========================================"

          find build \
            -type f \
            -name "*.so" \
            -print \
            | sort

          SO_PATH="$(find build \
            -type f \
            -name "libOutlineRGB.so" \
            -print \
            -quit)"

          if [ -z "$SO_PATH" ]; then
            echo ""
            echo "ERROR: libOutlineRGB.so was not found."
            exit 1
          fi

          echo ""
          echo "Found:"
          echo "$SO_PATH"

          echo "SO_PATH=$SO_PATH" >> "$GITHUB_ENV"

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package LeviPack
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Packaging OutlineRGB.levipack"
          echo "========================================"

          python3 scripts/package_levipack.py

      # ============================================================
      # VERIFY
      # ============================================================

      - name: Verify LeviPack
        shell: bash
        run: |
          set -e

          PACKAGE="dist/OutlineRGB.levipack"

          if [ ! -f "$PACKAGE" ]; then
            echo "ERROR: LeviPack was not generated."
            exit 1
          fi

          echo "========================================"
          echo "LeviPack contents"
          echo "========================================"

          unzip -l "$PACKAGE"

          echo ""
          echo "========================================"
          echo "Manifest"
          echo "========================================"

          unzip -p "$PACKAGE" manifest.json

          echo ""
          echo "========================================"
          echo "Shared library"
          echo "========================================"

          unzip -p "$PACKAGE" manifest.json >/dev/null

          unzip -l "$PACKAGE" | grep \
            "lib/arm64-v8a/libOutlineRGB.so"

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload LeviPack
        uses: actions/upload-artifact@v4
        with:
          name: OutlineRGB-levipack-arm64
          path: dist/OutlineRGB.levipack
          if-no-files-found: error

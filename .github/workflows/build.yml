name: Build OutlineRGB

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"

  pull_request:

jobs:
  build:
    name: Build Android ARM64 LeviPack

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Check project files
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Project files"
          echo "========================================"

          test -f xmake.lua
          test -f assets/manifest.json
          test -f scripts/package_levipack.py

          echo "xmake.lua                 OK"
          echo "assets/manifest.json      OK"
          echo "package_levipack.py       OK"

      - name: Validate packaging script
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Python syntax check"
          echo "========================================"

          python3 -m py_compile scripts/package_levipack.py

          echo "Python syntax OK"

      - name: Validate source manifest
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Source manifest"
          echo "========================================"

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("assets/manifest.json")

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          print(json.dumps(
              data,
              indent=2,
              ensure_ascii=False
          ))

          assert data["type"] == "preload-native"
          assert data["entry"] == "libOutlineRGB.so"

          versions = data.get("minecraft_versions", [])

          assert "1.26.4*" in versions, (
              "minecraft_versions must contain 1.26.4*"
          )

          print()
          print("Source manifest compatibility OK")
          PY

      - name: Configure Android ARM64
        shell: bash
        run: |
          set -e

          xmake f \
            -p android \
            -a arm64-v8a \
            -m release \
            -y

      - name: Build
        shell: bash
        run: |
          set -e

          xmake -y

      - name: Locate ARM64 library
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Searching for ARM64 shared library"
          echo "========================================"

          find build \
            -type f \
            -name "*.so" \
            -print

          LIBRARY="$(find build \
            -type f \
            -name "liboutlinergb.so" \
            -print -quit)"

          if [ -z "$LIBRARY" ]; then
            echo
            echo "ERROR: liboutlinergb.so was not found."
            exit 1
          fi

          echo
          echo "Found:"
          echo "$LIBRARY"

          mkdir -p dist

          cp "$LIBRARY" dist/libOutlineRGB.so

          echo
          echo "Packaged build input:"
          ls -lh dist/libOutlineRGB.so

      - name: Verify ARM64 ELF
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Checking ELF architecture"
          echo "========================================"

          file dist/libOutlineRGB.so

          readelf -h dist/libOutlineRGB.so | tee /tmp/readelf.txt

          grep -q "AArch64" /tmp/readelf.txt

          echo
          echo "ARM64/AArch64 ELF OK"

      - name: Package LeviPack
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Package LeviPack"
          echo "========================================"

          python3 scripts/package_levipack.py \
            --library dist/libOutlineRGB.so \
            --manifest assets/manifest.json \
            --output dist/OutlineRGB.levipack

      - name: Verify LeviPack
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Final LeviPack"
          echo "========================================"

          test -f dist/OutlineRGB.levipack

          echo
          echo "ZIP entries:"
          unzip -l dist/OutlineRGB.levipack

          echo
          echo "Manifest:"
          unzip -p \
            dist/OutlineRGB.levipack \
            manifest.json

          echo
          echo "========================================"
          echo "Strict structure check"
          echo "========================================"

          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          package = Path("dist/OutlineRGB.levipack")

          expected = {
              "manifest.json",
              "libOutlineRGB.so",
          }

          with zipfile.ZipFile(package, "r") as z:
              names = set(z.namelist())

              print("Actual:")
              for name in sorted(names):
                  print("  ", name)

              assert names == expected, (
                  f"Invalid package structure: {sorted(names)}"
              )

              manifest = json.loads(
                  z.read("manifest.json")
              )

              assert manifest["type"] == "preload-native"
              assert manifest["entry"] == "libOutlineRGB.so"
              assert "1.26.4*" in manifest["minecraft_versions"]

              print()
              print("Manifest compatibility:")
              print(
                  "  Minecraft 1.26.4* : OK"
              )

          print()
          print("LeviPack structure: OK")
          PY

      - name: Upload LeviPack
        uses: actions/upload-artifact@v4
        with:
          name: OutlineRGB-levipack-arm64
          path: dist/OutlineRGB.levipack
          if-no-files-found: error

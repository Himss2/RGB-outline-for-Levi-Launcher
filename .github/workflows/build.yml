name: Build OutlineRGB

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: Build Android ARM64 LeviPack

    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # SHOW REPOSITORY
      # ============================================================

      - name: Show repository structure
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Repository"
          echo "========================================"

          echo "Workspace:"
          pwd

          echo ""
          echo "Root files:"
          find . -maxdepth 2 -type f | sort

          echo ""
          echo "Manifest files:"
          find . \
            -type f \
            -name "manifest.json" \
            -not -path "./.git/*" \
            -not -path "./build/*" \
            -not -path "./dist/*" \
            -print \
            | sort

      # ============================================================
      # JAVA
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # ANDROID
      # ============================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # XMAKE
      # ============================================================

      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      # ============================================================
      # CONFIGURE
      # ============================================================

      - name: Configure Android ARM64
        shell: bash
        run: |
          set -e

          xmake f \
            -p android \
            -a arm64-v8a \
            -m release

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build
        shell: bash
        run: |
          set -e

          xmake -y

      # ============================================================
      # SHOW SO
      # ============================================================

      - name: Locate native library
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Android ARM64 libraries"
          echo "========================================"

          find build \
            -type f \
            -name "*.so" \
            -print \
            | sort

          SO_PATH="$(find build \
            -type f \
            -iname "liboutlinergb.so" \
            -print \
            -quit)"

          if [ -z "$SO_PATH" ]; then
            echo ""
            echo "ERROR: OutlineRGB shared library was not found."
            echo ""
            echo "Available .so files:"
            find build \
              -type f \
              -name "*.so" \
              -print \
              | sort
            exit 1
          fi

          echo ""
          echo "Selected library:"
          echo "$SO_PATH"

          echo "SO_PATH=$SO_PATH" >> "$GITHUB_ENV"

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package LeviPack
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Package LeviPack"
          echo "========================================"

          python3 scripts/package_levipack.py

      # ============================================================
      # VERIFY
      # ============================================================

      - name: Verify LeviPack
        shell: bash
        run: |
          set -e

          PACKAGE="dist/OutlineRGB.levipack"

          if [ ! -f "$PACKAGE" ]; then
            echo "ERROR: $PACKAGE was not created."
            exit 1
          fi

          echo "========================================"
          echo "LeviPack contents"
          echo "========================================"

          unzip -l "$PACKAGE"

          echo ""
          echo "========================================"
          echo "Manifest"
          echo "========================================"

          unzip -p "$PACKAGE" manifest.json

          echo ""
          echo "========================================"
          echo "Checking native library"
          echo "========================================"

          if ! unzip -l "$PACKAGE" | grep -q \
            "lib/arm64-v8a/libOutlineRGB.so"; then

            echo "ERROR: libOutlineRGB.so missing from package."
            exit 1
          fi

          echo ""
          echo "LeviPack verification: OK"

      # ============================================================
      # ARTIFACT
      # ============================================================

      - name: Upload LeviPack
        uses: actions/upload-artifact@v4
        with:
          name: OutlineRGB-levipack-arm64
          path: dist/OutlineRGB.levipack
          if-no-files-found: error
